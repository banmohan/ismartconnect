services:
  postgres:
    image: postgres:16
    container_name: ismart-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ismart_connect
    ports:
      - "5433:5432"
    volumes:
      - ismart_pgdata:/var/lib/postgresql/data

volumes:
  ismart_pgdata:

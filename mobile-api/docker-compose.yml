# MobileApi only. Postgres and PremiumCBS stay on the local network.
# From inside this container, 127.0.0.1 is the container itself.
# Put the LAN address of each machine in DATABASE_URL and CBS_ACCOUNT_URL
# (for example 172.18.100.16). If one of them runs on this Mac, use
# host.docker.internal instead of localhost.
services:
  mobile-api:
    build: .
    container_name: mobile-api
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DATABASE_URL: postgres://USER:PASSWORD@HOST:5432/mobile_api
      CBS_ACCOUNT_URL: http://HOST:8060
      CBS_API_KEY: replace-me
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: replace-me
      COOKIE_SECRET: replace-with-a-long-random-string
      COOKIE_SECURE: "false"
      BIND_ADDR: 0.0.0.0:8080
      CBS_TIMEOUT_SECS: "60"
    ports:
      - "8080:8080"

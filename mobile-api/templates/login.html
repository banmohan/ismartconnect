<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sign in · MobileApi</title>
    <link rel="stylesheet" href="/static/app.css">
</head>
<body class="login-body">
<main class="login-card">
    <p class="eyebrow">MobileApi</p>
    <h1>Sign in</h1>
    <p class="lede">Operations console for the provider gateway.</p>
    {% if notice != "" %}<div class="notice">{{ notice }}</div>{% endif %}
    {% if error != "" %}<div class="alert">{{ error }}</div>{% endif %}
    <form method="post" action="/admin/login" class="stack">
        <label>Username<input name="username" value="{{ username }}" autocomplete="username" required></label>
        <label>Password<input type="password" name="password" autocomplete="current-password" required></label>
        <input type="hidden" name="next" value="{{ next }}">
        <button type="submit" class="primary">Continue</button>
    </form>
</main>
</body>
</html>
